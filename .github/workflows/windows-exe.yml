name: build-windows-exe

on:
  push:
    branches: [ feature/hsv-calibrator ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build exe with PyInstaller
        run: |
          pyinstaller tools/hsv_calibrator.py --onefile --name HSVCalibrator --noconfirm --clean --version-file windows/version_file.txt

      - name: Archive artifact (zip)
        shell: pwsh
        run: |
          Copy-Item scripts/run_calibrator.bat dist/
          New-Item -ItemType Directory -Force -Path dist/calibrations | Out-Null
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          Copy-Item windows/version_file.txt dist/windows/
          Compress-Archive -Path dist/HSVCalibrator.exe, dist/run_calibrator.bat, dist/windows/version_file.txt -DestinationPath dist/HSVCalibrator-win64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HSVCalibrator-win64
          path: dist/HSVCalibrator-win64.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HSVCalibrator-win64.zip
